version: '3.8'

services:
  # --- BASES DE DATOS ---
  usuarios-db:
    image: postgres:15
    container_name: cosituc-usuarios-db
    environment:
      - POSTGRES_USER=usuarios_user
      - POSTGRES_PASSWORD=usuarios123
      - POSTGRES_DB=usuarios_db
    ports:
      - "5431:5432"
    volumes:
      - ./usuarios/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cosituc-net

  boletos-db:
    image: postgres:15
    container_name: cosituc-boletos-db
    environment:
      - POSTGRES_USER=boletos_user
      - POSTGRES_PASSWORD=boletos123
      - POSTGRES_DB=boletos_db
    ports:
      - "5432:5432"
    volumes:
      - ./boletos/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cosituc-net

  reservas-db:
    image: postgres:15
    container_name: cosituc-reservas-db
    environment:
      - POSTGRES_USER=reservas_user
      - POSTGRES_PASSWORD=reservas123
      - POSTGRES_DB=reservas_db
    ports:
      - "5433:5432"
    volumes:
      - ./reservas/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cosituc-net

  garita-db:
    image: postgres:15
    container_name: cosituc-garita-db
    environment:
      - POSTGRES_USER=garita_user
      - POSTGRES_PASSWORD=garita123
      - POSTGRES_DB=garita_db
    ports:
      - "5434:5432"
    networks:
      - cosituc-net

  # --- MICROSERVICIOS ---
  usuarios:
    build: ./usuarios
    container_name: cosituc-usuarios
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DB_HOST=usuarios-db
      - DB_PORT=5432
      - DB_NAME=usuarios_db
      - DB_USER=usuarios_user
      - DB_PASSWORD=usuarios123
    depends_on:
      - usuarios-db
    networks:
      - cosituc-net

  boletos:
    build: ./boletos
    container_name: cosituc-boletos
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DB_HOST=boletos-db
      - DB_PORT=5432
      - DB_NAME=boletos_db
      - DB_USER=boletos_user
      - DB_PASSWORD=boletos123
    depends_on:
      - boletos-db
    networks:
      - cosituc-net

  reservas:
    build: ./reservas
    container_name: cosituc-reservas
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DB_HOST=reservas-db
      - DB_PORT=5432
      - DB_NAME=reservas_db
      - DB_USER=reservas_user
      - DB_PASSWORD=reservas123
      - USUARIOS_SERVICE_URL=http://usuarios:3001
      - BOLETOS_SERVICE_URL=http://boletos:3002
    depends_on:
      - usuarios
      - boletos
      - reservas-db
    networks:
      - cosituc-net

networks:
  cosituc-net:
    driver: bridge
